<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio ULICORI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap');

  :root{
    --navy:#173D6C;
    --navy-deep:#102A4C;
    --blue-dark:#005B9B;
    --blue-mid:#1167A6;
    --blue:#2279BC;
    --blue-light:#4196D2;
    --blue-pale:#8BBEE8;
    --blue-paler:#B2DAF4;
    --blue-faint:#DFEFFA;
    --ink:#16232F;
    --ink-soft:#5B6B78;
    --line:#D8E6F3;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:'Open Sans', Arial, sans-serif;
    line-height:1.5;
  }

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:0 24px 96px;
  }

  /* ---- Masthead ---- */
  header.masthead{
    position:relative;
    background:var(--navy);
    color:var(--white);
    padding:56px 24px 40px;
    margin-bottom:36px;
    overflow:hidden;
  }
  header.masthead .mast-inner{
    max-width:932px;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  .blocks{
    position:absolute;
    top:0;
    right:0;
    width:220px;
    height:100%;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    opacity:0.9;
  }
  .blocks span{display:block;}
  .blocks span:nth-child(1){background:var(--blue-dark);}
  .blocks span:nth-child(2){background:var(--navy-deep);}
  .blocks span:nth-child(3){background:var(--blue-paler);}
  .blocks span:nth-child(4){background:var(--blue-mid);}
  .blocks span:nth-child(5){background:var(--blue);}
  .blocks span:nth-child(6){background:var(--navy-deep);}
  .blocks span:nth-child(7){background:var(--blue-paler);}
  .blocks span:nth-child(8){background:var(--blue-light);}
  .blocks span:nth-child(9){background:var(--blue-dark);}

  .eyebrow-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .kicker{
    font-size:14px;
    letter-spacing:0.01em;
    color:var(--blue-paler);
    font-weight:700;
  }
  .count{
    font-size:13px;
    color:var(--blue-paler);
  }
  h1{
    font-weight:800;
    font-size:clamp(30px, 4.5vw, 42px);
    margin:0 0 10px;
    color:var(--white);
    line-height:1.15;
  }
  .subtitle{
    font-size:16px;
    color:var(--blue-faint);
    max-width:52ch;
    font-weight:400;
  }

  /* ---- Search ---- */
  .search-bar{
    position:sticky;
    top:0;
    background:var(--white);
    z-index:10;
    padding:16px 0 20px;
    margin-bottom:4px;
  }
  .search-bar input{
    width:100%;
    padding:14px 18px;
    font-size:16px;
    font-family:inherit;
    background:var(--white);
    border:1.5px solid var(--blue-paler);
    border-radius:6px;
    color:var(--ink);
    outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-bar input:focus{
    border-color:var(--blue-dark);
    box-shadow:0 0 0 3px var(--blue-faint);
  }
  .search-bar input::placeholder{
    color:#9AAAB8;
  }

  nav.jumplinks{
    display:flex;
    flex-wrap:wrap;
    gap:8px 12px;
    margin-bottom:40px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  nav.jumplinks a{
    font-size:13px;
    font-weight:600;
    color:var(--blue-dark);
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
    white-space:nowrap;
  }
  nav.jumplinks a:hover{
    border-bottom-color:var(--blue-light);
  }
  nav.jumplinks .sep{
    color:var(--blue-paler);
  }

  /* ---- Departments ---- */
  section.dept{
    margin-bottom:38px;
    scroll-margin-top:88px;
  }
  .dept-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:12px;
    padding-left:12px;
    border-left:4px solid var(--blue-light);
  }
  .dept-head h2{
    font-weight:700;
    font-size:20px;
    color:var(--navy);
    margin:0;
    letter-spacing:0.01em;
  }
  .dept-head .n{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dept-head.leadership{
    border-left:none;
    background:var(--navy);
    padding:10px 16px;
    border-radius:4px;
  }
  .dept-head.leadership h2{
    color:var(--white);
  }
  .dept-head.leadership .n{
    color:var(--blue-paler);
  }

  .rows{
    border-top:1px solid var(--line);
  }
  .row{
    display:grid;
    grid-template-columns: 1.6fr 1.6fr 80px;
    gap:16px;
    align-items:center;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    transition:background 0.12s ease;
  }
  .row:hover{
    background:var(--blue-faint);
  }
  .row .name{
    font-weight:600;
    color:var(--ink);
  }
  .row .email{
    font-size:14px;
    color:var(--blue-dark);
    text-decoration:none;
    word-break:break-all;
  }
  .row .email:hover{
    text-decoration:underline;
  }
  .row .ext{
    font-size:14px;
    color:var(--ink-soft);
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:600;
  }
  .row .ext.none{
    color:var(--blue-paler);
    font-weight:400;
  }

  .empty-state{
    display:none;
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
    font-weight:600;
    font-size:18px;
  }

  footer.foot{
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width: 620px){
    header.masthead{padding:40px 20px 32px;}
    .blocks{width:100px;}
    .row{
      grid-template-columns: 1fr;
      gap:2px;
      padding:14px 4px;
    }
    .row .ext{
      text-align:left;
      color:var(--ink-soft);
    }
    .row .ext::before{
      content:"Ext. ";
    }
    .row .ext.none::before{
      content:"";
    }
  }
</style>
</head>
<body>

].map(r => ({name:r[0], dept:r[1], email:r[2], ext:r[3]}));

// group by department
const depts = {};
data.forEach(p => {
  if(!depts[p.dept]) depts[p.dept] = [];
  depts[p.dept].push(p);
});
const leadershipOrder = ['Rectoría','Vicerrectoría'];
const deptNames = Object.keys(depts).sort((a,b)=>a.localeCompare(b,'es'));
deptNames.forEach(d => depts[d].sort((a,b)=>a.name.localeCompare(b.name,'es')));
// leadership departments (Rectoría, Vicerrectoría) always lead the list
deptNames.sort((a,b) => {
  const ai = leadershipOrder.indexOf(a);
  const bi = leadershipOrder.indexOf(b);
  if(ai !== -1 && bi !== -1) return ai - bi;
  if(ai !== -1) return -1;
  if(bi !== -1) return 1;
  return a.localeCompare(b,'es');
});

function slug(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
}

const jumplinks = document.getElementById('jumplinks');
deptNames.forEach((d,i) => {
  const a = document.createElement('a');
  a.href = '#' + slug(d);
  a.textContent = d;
  jumplinks.appendChild(a);
  if(i < deptNames.length - 1){
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '·';
    jumplinks.appendChild(sep);
  }
});

const dirEl = document.getElementById('directory');

function render(filter){
  dirEl.innerHTML = '';
  let total = 0;
  let matches = 0;

  deptNames.forEach(d => {
    const people = depts[d];
    total += people.length;
    const filtered = filter
      ? people.filter(p =>
          p.name.toLowerCase().includes(filter) ||
          p.dept.toLowerCase().includes(filter) ||
          p.email.toLowerCase().includes(filter))
      : people;

    if(filtered.length === 0) return;
    matches += filtered.length;

    const section = document.createElement('section');
    section.className = 'dept';
    section.id = slug(d);

    const head = document.createElement('div');
    head.className = 'dept-head' + (leadershipOrder.includes(d) ? ' leadership' : '');
    head.innerHTML = `<h2>${d}</h2><span class="n">${filtered.length}</span>`;
    section.appendChild(head);

    const rows = document.createElement('div');
    rows.className = 'rows';
    filtered.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span class="name">${p.name}</span>
        <a class="email" href="mailto:${p.email}">${p.email}</a>
        <span class="ext ${p.ext ? '' : 'none'}">${p.ext ? p.ext : '—'}</span>
      `;
      rows.appendChild(row);
    });
    section.appendChild(rows);
    dirEl.appendChild(section);
  });

  document.getElementById('resultCount').textContent = filter
    ? `${matches} de ${total} contactos`
    : `${total} contactos`;
  document.getElementById('emptyState').style.display = matches === 0 ? 'block' : 'none';
  document.getElementById('jumplinks').style.display = filter ? 'none' : 'flex';
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  render(e.target.value.trim().toLowerCase());
});

render('');
</script>
